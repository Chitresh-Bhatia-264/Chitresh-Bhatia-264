<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="0.5" stop-color="#ece0fb"/>
      <stop offset="1" stop-color="#d9f6f4"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7eb6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="28" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="50" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="110" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="130" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="230" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.85">
    <g>
      <ellipse cx="0" cy="70" rx="45" ry="16"/><ellipse cx="25" cy="58" rx="28" ry="16"/><ellipse cx="-22" cy="60" rx="22" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="-100 0" to="900 0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="0" cy="220" rx="55" ry="18"/><ellipse cx="28" cy="206" rx="32" ry="17"/><ellipse cx="-26" cy="208" rx="25" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="-150 0" to="950 0" dur="30s" begin="-12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating data dots -->
  <g fill="#c77dff">
    <circle cx="260" cy="150" r="4" opacity="0.7"><animate attributeName="cy" values="150;135;150" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="170" r="3" opacity="0.5"><animate attributeName="cy" values="170;180;170" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="170" r="4" fill="#ff7eb6" opacity="0.7"><animate attributeName="cy" values="170;185;170" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="565" cy="145" r="3" fill="#7fd8d3" opacity="0.8"><animate attributeName="cy" values="145;132;145" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shadow -->
  <ellipse cx="400" cy="278" rx="50" ry="7" fill="#9b7fd4" opacity="0.25">
    <animate attributeName="rx" values="50;36;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.12;0.25" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- robot (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="3s" repeatCount="indefinite"/>

    <!-- flame -->
    <g transform="translate(400 212)">
      <g>
        <polygon points="-16,0 16,0 0,34" fill="url(#flame)"/>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1.45;1 0.85;1 1.25;1 1" dur="0.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- arms -->
    <rect x="333" y="165" width="32" height="13" rx="6.5" fill="#ffffff" stroke="#c3b1e1" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 365 171;22 365 171;0 365 171" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="435" y="165" width="32" height="13" rx="6.5" fill="#ffffff" stroke="#c3b1e1" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 435 171;-28 435 171;0 435 171;-28 435 171;0 435 171" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <!-- body -->
    <rect x="365" y="152" width="70" height="60" rx="20" fill="#ffffff" stroke="#c3b1e1" stroke-width="4"/>
    <circle cx="400" cy="182" r="9" fill="#ffd1dc" stroke="#ff7eb6" stroke-width="2">
      <animate attributeName="r" values="9;11;9" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="340" y="72" width="120" height="86" rx="32" fill="#ffffff" stroke="#c3b1e1" stroke-width="4"/>
    <rect x="352" y="84" width="96" height="60" rx="22" fill="#5b4b8a"/>

    <!-- eyes -->
    <ellipse cx="380" cy="108" rx="9" ry="11" fill="#a0e7e5">
      <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="420" cy="108" rx="9" ry="11" fill="#a0e7e5">
      <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="383" cy="104" r="3" fill="#ffffff"/>
    <circle cx="423" cy="104" r="3" fill="#ffffff"/>

    <!-- cheeks and smile -->
    <circle cx="366" cy="124" r="6" fill="#ff9ebb" opacity="0.75"/>
    <circle cx="434" cy="124" r="6" fill="#ff9ebb" opacity="0.75"/>
    <path d="M390 124 Q400 134 410 124" fill="none" stroke="#ffb3c6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- antenna and propeller -->
    <line x1="400" y1="72" x2="400" y2="54" stroke="#c3b1e1" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="400" cy="52" rx="52" ry="5" fill="#c77dff" opacity="0.85">
      <animate attributeName="rx" values="52;6;52" dur="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="400" cy="46" r="6" fill="#ff7eb6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- speech bubble -->
    <g>
      <rect x="480" y="46" width="170" height="38" rx="19" fill="#ffffff" stroke="#ffb3c6" stroke-width="3"/>
      <polygon points="486,70 470,86 500,80" fill="#ffffff" stroke="#ffb3c6" stroke-width="3" stroke-linejoin="round"/>
      <rect x="484" y="68" width="22" height="10" fill="#ffffff"/>
      <text x="565" y="70" text-anchor="middle" font-family="Fira Code, monospace, sans-serif" font-size="14" font-weight="600" fill="#9b7fd4">RAG agent online!</text>
    </g>
  </g>
</svg>
